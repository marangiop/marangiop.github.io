title: Paolo's Notes
description: Short pieces on communication, mindfulness, Buddhist Psychology and whatever else is worth writing down.
theme: minima

# Minima theme options (optional, tweak as you like)
minima:
  skin: dark
  social_links:
    github: marangiop

# Jekyll settings
markdown: kramdown
permalink: /:title/

# Show full post list on homepage
show_excerpts: false

# Show posts even if their date is in the future
future: true

# Auto-generates /sitemap.xml on every build, listing all pages/posts
plugins:
  - jekyll-sitemap

# Needed by jekyll-sitemap to build correct absolute URLs
url: "https://marangiop.github.io"